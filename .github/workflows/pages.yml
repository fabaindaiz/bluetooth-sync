# The panel as a PWA on GitHub Pages (d-7c8794-37f9bc): built from host/web and the panel's files,
# published at https://fabaindaiz.github.io/bluetooth-sync/. The site is public and carries no data
# of any device: `npm run build:pwa` fails if it finds a MAC, a private address or a token
# (host/web/pwa/privacy.ts).
#
# Published as the `gh-pages` branch (2026-10-04), as thom-music-player's site: only the built site
# and `.nojekyll`, one commit per version on top of the branch (never a force push). Pages serves it
# with Settings → Pages → Deploy from a branch → gh-pages / (root). Actions pinned to the commit of
# their release.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "host/web/**"
      - "host/src/aurasync/panel/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to push the gh-pages branch
    defaults:
      run:
        working-directory: host/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          cache: npm
          cache-dependency-path: host/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:pwa
      - name: Push the site to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          site="$RUNNER_TEMP/gh-pages"
          if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "$remote" "$site"
          else
            git init --quiet -b gh-pages "$site"
          fi
          # The branch holds the site and nothing else: what is not in this build goes.
          find "$site" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist-pwa/. "$site"/
          touch "$site/.nojekyll"
          cd "$site"
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages: nothing changed"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "La PWA del panel desde ${GITHUB_SHA::7}"
          git push --quiet "$remote" HEAD:gh-pages
