            - radio "Frente intacto Adelante, el estéreo tal cual; el resto, solo el ambiente. costo ~3 ms por bloque con 3 parlantes · sin latencia"
            - text: Frente intacto Adelante, el estéreo tal cual; el resto, solo el ambiente. costo ~3 ms por bloque con 3 parlantes · sin latencia
            - 'radio "Directo Estéreo puro alineado: sin efectos, mismo volumen. sin latencia"'
