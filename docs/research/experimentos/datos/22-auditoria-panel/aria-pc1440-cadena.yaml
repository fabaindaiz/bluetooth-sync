          - paragraph: Cómo se reparte el estéreo entre los parlantes.
          - group "Algoritmo con un corte breve":
            - text: Algoritmo con un corte breve
            - radio "Clásico Una mezcla de L y R por parlante, como hasta ahora. sin latencia · por defecto" [checked]
