            - status: 0,70
            - 'button "Pan de JBL Go 4 Black: volver a 0,00"': ↺
            - slider "Ambiente de JBL Go 4 Black": "0.15"
            - status: 0,15
            - 'button "Ambiente de JBL Go 4 Black: volver a 0,00"': ↺
            - button "Go 4 Blue"
            - slider "Pan de JBL Go 4 Blue": "0"
            - status: 0,00
            - slider "Ambiente de JBL Go 4 Blue": "0.55"
            - status: 0,55
            - 'button "Ambiente de JBL Go 4 Blue: volver a 0,00"': ↺
            - button "Virtual 1"
            - slider "Pan de Virtual 1": "-0.7"
            - status: "-0,70"
            - 'button "Pan de Virtual 1: volver a 0,00"': ↺
            - slider "Ambiente de Virtual 1": "0.55"
            - status: 0,55
            - 'button "Ambiente de Virtual 1: volver a 0,00"': ↺
          - 'group "Ambiente: en vivo"':
            - text: En vivo
            - term: mezcla de ambiente ahora
            - definition: 1,00
            - term: ambiente en la salida
            - definition: 0 %
