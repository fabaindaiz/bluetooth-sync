- banner:
  - text: aurasync SIMULADO
  - status "Recibe el estado y los niveles por stream": En vivo
  - text: cambios sin guardar
  - button "Guardar instalación"
  - region "Reproducción":
    - button "Detener"
    - text: Volumen
    - status "Volumen": "-20 dB"
    - slider: "-20"
    - combobox "Fuente":
      - 'option "Fuente: todo el sistema"'
      - 'option "Fuente: una aplicación"'
      - 'option "Fuente: un archivo"'
      - 'option "Fuente: señal de prueba" [selected]'
      - 'option "Fuente: render multicanal"'
    - combobox "Cómo se reparte el sonido entre los parlantes":
      - 'option "Modo: clásico" [selected]'
      - 'option "Modo: espacial"'
      - 'option "Modo: frente intacto"'
      - 'option "Modo: directo"'
    - button "3 cortes en 1 min"
    - text: "Latencia -27 ms Preset: amplio"
  - navigation "Secciones":
    - button "Escuchar"
    - button "Cadena"
    - button "Parlantes"
    - button "Calibrar"
    - button "Diagnóstico"
    - button "Ajustes"
- main:
  - region "Cadena":
    - heading "Cadena" [level=2]
    - text: cada etapa en el orden en que suena · (?) explica cada perilla
    - group "Calidad":
      - text: "Entrada -14,0 LUFS sonoridad, últimos 3 s Salida (suma) -38,1 LUFS todos los parlantes Ganancia de la cadena -4,1 LU con el volumen: -24,1 LU PSR entrada / salida 5,4 / 6,2 dB salida: la menor, Go 4 Black Pico real máximo -35,7 dBTP de las salidas, últimos 3 s Limitador 0 % del tiempo, el que más trabaja"
      - list:
        - listitem: "Ganancia perdida: la cadena suena 4,1 LU más baja que la entrada (sin contar el volumen)."
    - navigation "Etapas, en el orden de proceso":
      - text: Entrada
      - button "Ambiente"
      - button "Modo espacial"
      - button "Decorrelación"
      - button "Difusión"
      - button "Alineación"
      - button "Ecualización"
      - button "Graves"
      - button "Volumen"
      - button "Limitador"
      - text: Parlantes la cadena agrega 66,8 ms, igual en todos
    - list:
      - listitem:
        - region "Ambiente":
          - heading "Ambiente" [level=3]
          - text: +42,7 ms
          - 'button "Ayuda: Ambiente"': "?"
          - paragraph: Separa del estéreo lo que no está igual en los dos canales —la sala, la reverberación— para mandarlo a los parlantes que envuelven.
          - group "Algoritmo en vivo":
            - text: Algoritmo en vivo
            - radio "Coherencia entre canales Extrae el ambiente por coherencia, banda por banda. costo ~1 ms por bloque · latencia 42,7 ms · por defecto" [checked]
            - text: Coherencia entre canales Extrae el ambiente por coherencia, banda por banda. costo ~1 ms por bloque · latencia 42,7 ms · por defecto
            - radio "Sin extraer Todos los parlantes reciben solo el sonido directo, según su pan. latencia 42,7 ms"
            - text: Sin extraer Todos los parlantes reciben solo el sonido directo, según su pan. latencia 42,7 ms
          - group: Perillas de «Coherencia entre canales» 6
          - 'group "Por parlante: Pan, Ambiente"':
            - button "Go 4 Red"
            - slider "Pan de JBL Go 4 Red": "-0.7"
            - status: "-0,70"
            - 'button "Pan de JBL Go 4 Red: volver a 0,00"': ↺
            - slider "Ambiente de JBL Go 4 Red": "0.15"
            - status: 0,15
            - 'button "Ambiente de JBL Go 4 Red: volver a 0,00"': ↺
            - button "Go 4 Black"
