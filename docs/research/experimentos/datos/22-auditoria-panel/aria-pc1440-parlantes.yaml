          - cell "—"
          - cell "-61 dBm"
          - cell "Emparejar y conectar":
            - button "Emparejar y conectar"
    - paragraph: Se listan los dispositivos de audio que conoce el sistema. Uno apagado o fuera de alcance aparece como «emparejado, sin conectar». Para uno nuevo, ponelo en modo emparejamiento (botón Bluetooth del parlante) y tocá Buscar cerca. La señal solo se conoce mientras se busca.
