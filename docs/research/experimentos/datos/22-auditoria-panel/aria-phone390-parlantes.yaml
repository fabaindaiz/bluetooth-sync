  - region "Sala":
    - heading "Sala" [level=2]
    - group "Distribución":
      - button "Cuadrafonía FL FR RL RR" [pressed]
      - button "Películas L C R S"
      - button "5.0 L C R SL SR"
      - button "Hexágono 6"
      - button "7.0 L C R SL SR RL RR"
      - button "Octógono 8"
      - button "Dos anillos 4 + 4"
      - button "Automático N parlantes"
    - text: "frente FL JBL Go 4 Red FR JBL Go 4 Black RL Virtual 1 RR libre Go 4 Blue sin rol: 1"
    - status:
      - text: 1 parlante quedó sin lugar en esta sala (tiene lugar para 3). «Automático» los reparte a todos alrededor.
      - button "Usar «Automático»"
  - region "Espacial":
    - heading "Espacial" [level=2]
    - paragraph: Cada parlante es principal (sonido directo, con dirección) o ambiental (el ambiente, sin dirección). En modo espacial cada instrumento sale de los principales de su lado.
    - text: Modo
    - combobox "Modo de render":
      - option "Clásico" [selected]
      - option "Espacial"
      - option "Frente intacto"
      - option "Directo"
    - text: Carácter (ubicación ↔ envolvimiento)
    - slider "Carácter": "0.5"
    - button "Todos principales"
    - list:
      - listitem:
        - text: JBL Go 4 Red
        - button "Principal" [pressed]
        - button "Ambiental"
      - listitem:
        - text: JBL Go 4 Black
        - button "Principal" [pressed]
        - button "Ambiental"
      - listitem:
        - text: JBL Go 4 Blue
        - button "Principal" [pressed]
        - button "Ambiental"
      - listitem:
        - text: Virtual 1
        - button "Principal" [pressed]
        - button "Ambiental"
    - 'figure "La pieza vista desde arriba: tú en el centro, cada principal en su ángulo; los ambientales, alrededor."':
      - 'img "La pieza vista desde arriba: tú en el centro, cada principal en su ángulo; los ambientales, alrededor."': JBL Go 4 Red JBL Go 4 Black JBL Go 4 Blue Virtual 1
      - text: "La pieza vista desde arriba: tú en el centro, cada principal en su ángulo; los ambientales, alrededor."
    - group: "Cada perilla: recomendación y cómo cambia el sonido"
