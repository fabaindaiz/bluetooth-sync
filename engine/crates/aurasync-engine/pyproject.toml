[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "aurasync-engine"
version = "0.1.0"
description = "The aurasync DSP in Rust (PyO3): the delay read, spatial upmix, ambience extractor, FIR filters, virtual bass and true-peak limiter."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[tool.maturin]
module-name = "aurasync_engine"
