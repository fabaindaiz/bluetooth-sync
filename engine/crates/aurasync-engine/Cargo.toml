[package]
name = "aurasync-engine"
version = "0.1.0"
description = "The aurasync DSP as a Python extension (PyO3), built with maturin."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "aurasync_engine"
crate-type = ["cdylib"]

[features]
# `_panic()`, a function that panics inside the read's guard: only for the tests that check a
# panic reaches Python as `RuntimeError` (host/tests/test_engine_rust.py).
test-panic = []

# Exact versions: PyO3 and rust-numpy change their API between minor versions, and the two must
# agree (rust-numpy 0.29 is built for PyO3 0.29). No `extension-module` feature: maturin sets
# PYO3_BUILD_EXTENSION_MODULE itself, and without the feature `cargo test` still links.
[dependencies]
aurasync-dsp = { path = "../aurasync-dsp" }
numpy = "=0.29.0"
pyo3 = { version = "=0.29.3", features = ["abi3-py312"] }
