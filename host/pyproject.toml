[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aurasync"
dynamic = ["version"]
description = "Un canal de audio distinto a cada parlante Bluetooth, sincronizados por Auracast (en investigación)"
readme = "README.md"
requires-python = ">=3.12"
# Sin el extra `auracast` de Bumble: trae sounddevice, que en Linux exige PortAudio
# del sistema, y la captura no pasa por ahí (docs/research/08 §2).
# lc3py solo publica ruedas para macOS arm64 y Linux x86_64. En otra plataforma la
# instalación falla, y eso es intencional (fail-closed).
# Versiones exactas: Bumble no llegó a 1.0 y cambia su API entre versiones. Las
# dependencias transitivas no se fijan (ver la nota sobre lockfiles más abajo).
dependencies = [
  "bumble==0.0.235",
  "lc3py==1.1.3",
  # numpy hace el DSP: decorrelación, extracción de ambiente y la medición de desfase
  # con micrófono. Sin scipy a propósito: todo lo que hace falta (FFT, convolución,
  # ajuste por mínimos cuadrados) está en numpy, y scipy es una dependencia pesada que
  # en la Raspberry Pi de la Fase 3 costaría compilar.
  "numpy>=2.0",
  # El QR del panel para abrirlo desde el teléfono (spec del servicio §15). Python puro,
  # sin dependencias; es la que eligió el diseño del panel (docs/research/09-panel… en la
  # rama panel-demo).
  "segno==1.6.6",
  # El HTTPS del servicio con su raíz propia (tls.py, d-7c8794-37f9bc). Ya venía instalada
  # porque Bumble la exige (>=44.0.3); se declara porque tls.py la importa directo. Tiene
  # ruedas abi3 para Linux aarch64 (la Pi) y macOS arm64. Se prefirió a llamar a `openssl`:
  # el del Mac es LibreSSL, con otras opciones, y las restricciones de nombre se arman mejor
  # como objetos que como archivo de configuración.
  "cryptography>=44.0.3",
]

[project.scripts]
aurasync = "aurasync.cli:main"

[tool.hatch.version]
path = "src/aurasync/__init__.py"

# Sin lockfiles de hatch (`lock-envs`): con `locked = true`, hatch 1.18.1 aplica el
# lock con `uv pip sync`, que desinstala todo lo que no está en el lock, incluido el
# propio proyecto en modo desarrollo, y los tests no lo encuentran. Se reabre si una
# versión de hatch lo corrige (docs/decisions.md, d-7c8794-c23c20).
[tool.hatch.envs.default]
installer = "uv"
python = "3.12"

# Los tipos TypeScript del contrato para la aplicación web del panel (d-7c8794-6da524):
# `hatch run gen-types` escribe web/src/contract.gen.ts; con `--check` solo comprueba.
[tool.hatch.envs.default.scripts]
gen-types = "python -m aurasync.contract_types {args}"
# El motor en Rust para el servicio (`"engine": "rust"` en service.json, engine/README.md): sin la
# feature `test-panic`, y comprobado después de instalarlo. No va en `post-install-commands`: el
# servicio corre igual sin cargo, con numpy (d-7c8794-196e0c). Después de cambiar el Rust, otra vez.
engine-build = [
  "command -v cargo >/dev/null || (echo 'falta cargo: instalá rustup, ver engine/README.md' >&2; exit 1)",
  "{env:HATCH_UV} pip install --quiet maturin==1.15.0",
  'PATH="$PATH:$(dirname "{env:HATCH_UV}")" maturin develop --uv --release -m ../engine/crates/aurasync-engine/Cargo.toml',
  "python -m aurasync.dsp.backend --check-production",
]

# El motor en Rust (engine/crates/aurasync-engine, PyO3 + maturin) se compila dentro del entorno
# de tests: tests/test_engine_rust.py falla, no se salta, si `aurasync_engine` no está.
# Un miembro de workspace de hatch no sirve: hatch 1.16.2 busca los miembros solo debajo de
# host/ y `../engine/...` da "No members could be derived". `post-install-commands` corre antes
# de instalar las `extra-dependencies`, así que el script trae maturin él mismo; y el venv de uv
# no tiene pip, por eso `maturin develop --uv` con el uv de hatch (`HATCH_UV`) al final del PATH.
# `run` y `run-cov` (lo que corre `hatch test`) compilan antes de pytest: con cargo es
# incremental (un par de segundos sin cambios), y así un cambio en el Rust nunca se prueba contra
# un `.so` viejo. Sin cargo, falla con un mensaje que dice qué instalar.
# La compilación de tests lleva la feature `test-panic` (`_panic`, `_panic_outside_the_read`).
[tool.hatch.envs.hatch-test]
installer = "uv"
post-install-commands = ["engine-build"]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.12"]

# Declarar `scripts` reemplaza los de hatch: `cov-combine` y `cov-report` se repiten tal cual, y
# `run` y `run-cov` con la compilación delante (hatch 1.16.2, hatch/env/internal/test.py).
[tool.hatch.envs.hatch-test.scripts]
run = ["engine-build", "pytest{env:HATCH_TEST_ARGS:} {args}"]
run-cov = ["engine-build", "coverage run -m pytest{env:HATCH_TEST_ARGS:} {args}"]
cov-combine = "coverage combine"
cov-report = "coverage report"
engine-build = [
  "command -v cargo >/dev/null || (echo 'falta cargo: instalá rustup, ver engine/README.md' >&2; exit 1)",
  "{env:HATCH_UV} pip install --quiet maturin==1.15.0",
  'PATH="$PATH:$(dirname "{env:HATCH_UV}")" maturin develop --uv --release --features test-panic -m ../engine/crates/aurasync-engine/Cargo.toml',
]

# El panel en navegadores reales (Playwright 1.60.0, como en la rama panel-demo). Usa el
# caché de navegadores de Playwright (`hatch run browser:install`). Va fuera de
# scripts/check.sh porque necesita esos navegadores instalados.
[tool.hatch.envs.browser]
installer = "uv"
python = "3.12"
extra-dependencies = ["playwright==1.60.0", "pytest==9.1.1"]

[tool.hatch.envs.browser.scripts]
install = "python -m playwright install chromium firefox"
test = "pytest tests_browser {args}"

# El CSS del panel se compila con el CLI de Tailwind, sin Node: `pytailwindcss` baja el
# binario oficial de la versión fijada. El CSS generado (`panel/tailwind.css`) se versiona,
# así el servicio no depende de nada en tiempo de ejecución ni de internet (el teléfono
# abre el panel en la red local). Después de tocar clases: `hatch run web:css`.
[tool.hatch.envs.web]
installer = "uv"
python = "3.12"
skip-install = true
dependencies = ["pytailwindcss==0.3.1"]

[tool.hatch.envs.web.env-vars]
TAILWINDCSS_VERSION = "v4.3.3"

[tool.hatch.envs.web.scripts]
css = "tailwindcss -i src/aurasync/panel/tailwind.input.css -o src/aurasync/panel/tailwind.css --minify"

[tool.ruff.lint.per-file-ignores]
# OJO: esta tabla **reemplaza** la que trae hatch, no la extiende. Por eso hay que repetir
# acá las exenciones de los tests, o aparecen 127 errores por usar `assert`.
# PLC0415: varios tests importan adentro para poder monkeypatchear el módulo antes.
"tests/**/*" = ["PLC0415", "PLC1901", "PLR2004", "PLR6301", "S", "TID252"]
# La CLI imprime: es su trabajo. Y difiere los imports pesados (numpy, el DSP) a dentro de
# cada subcomando, para que `aurasync --version` y la ayuda respondan al instante en vez de
# cargar todo el paquete.
"src/aurasync/cli.py" = ["T201", "PLC0415"]
# `pw-dump`, `pw-play` y `pw-record` se invocan por nombre y no por ruta absoluta: viven en
# PATH y su ubicación cambia entre distribuciones. Fijarla rompería la portabilidad sin
# ganar nada, porque el usuario ya controla su propio PATH.
# monitor.py lanza pw-play y pw-cli de la misma forma.
"src/aurasync/{sonido,monitor}.py" = ["S607"]
# El contrato del servicio de control (spec 2026-09-29): `ContractError(code, message)` lleva
# un código estable como primer argumento y el mensaje es para quien llama, no un texto que
# convenga repetir en una variable. EM y TRY003 piden lo contrario en cada `raise`.
"src/aurasync/{control,presets,service,rest,session,access,clients,pairing}.py" = ["EM101", "EM102", "TRY003"]
# Las fuentes y el observador llaman a pw-play, pactl, systemctl y bluetoothctl por nombre,
# por la misma razón que sonido.py; y sus errores son mensajes para el panel.
"src/aurasync/{sources,system}.py" = ["S607", "EM101", "EM102", "TRY003"]
# El servicio llama a `ip` y a `pipewire --version` por nombre, igual que sonido.py.
"src/aurasync/service.py" = ["S607"]
# Los scripts de host/scripts/ se corren sueltos (scripts/check.sh) e imprimen su veredicto.
"scripts/*" = ["INP001", "T201"]
# Los tests de navegador siguen las mismas excepciones que hatch da a tests/.
"tests_browser/**/*" = ["ARG001", "PLC0415", "PLR2004", "PLR6301", "S", "TC003", "TID252"]
