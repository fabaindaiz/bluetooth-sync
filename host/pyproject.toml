[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aurasync"
dynamic = ["version"]
description = "Un canal de audio distinto a cada parlante Bluetooth, sincronizados por Auracast (en investigación)"
readme = "README.md"
requires-python = ">=3.12"
# Sin el extra `auracast` de Bumble: trae sounddevice, que en Linux exige PortAudio
# del sistema, y la captura no pasa por ahí (docs/research/08 §2).
# lc3py solo publica ruedas para macOS arm64 y Linux x86_64. En otra plataforma la
# instalación falla, y eso es intencional (fail-closed).
# Versiones exactas: Bumble no llegó a 1.0 y cambia su API entre versiones. Las
# dependencias transitivas no se fijan (ver la nota sobre lockfiles más abajo).
# aiohttp sirve el panel de control y segno dibuja el QR de emparejamiento
# (docs/research/09, d-7c8794-d2fd15).
dependencies = [
  "aiohttp==3.14.3",
  "bumble==0.0.235",
  "lc3py==1.1.3",
  "segno==1.6.6",
]

[project.scripts]
aurasync = "aurasync.cli:main"

[tool.hatch.version]
path = "src/aurasync/__init__.py"

# Sin lockfiles de hatch (`lock-envs`): con `locked = true`, hatch 1.18.1 aplica el
# lock con `uv pip sync`, que desinstala todo lo que no está en el lock, incluido el
# propio proyecto en modo desarrollo, y los tests no lo encuentran. Se reabre si una
# versión de hatch lo corrige (docs/decisions.md, d-7c8794-c23c20).
[tool.hatch.envs.default]
installer = "uv"
python = "3.12"

[tool.hatch.envs.hatch-test]
installer = "uv"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.12"]

# Verificación del panel en navegadores reales (Playwright 1.60.0). Usa el caché de
# navegadores de Playwright (chromium-1223, webkit-2287); el Firefox de Playwright
# no arranca en el Mac de desarrollo. Va fuera de scripts/check.sh porque necesita
# esos navegadores instalados.
[tool.hatch.envs.browser]
installer = "uv"
python = "3.12"
extra-dependencies = ["playwright==1.60.0", "pytest==9.1.1"]

[tool.hatch.envs.browser.scripts]
test = "pytest tests_browser {args}"

# Los tests de navegador siguen las mismas excepciones que hatch da a tests/.
[tool.ruff.lint.extend-per-file-ignores]
"tests_browser/**/*" = ["S101", "S105", "PLR2004"]
