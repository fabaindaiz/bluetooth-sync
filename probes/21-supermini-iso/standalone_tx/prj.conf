CONFIG_BT=y
CONFIG_BT_ISO_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="aurasync-21"
CONFIG_BT_ISO_MAX_CHAN=4
CONFIG_BT_ISO_TX_BUF_COUNT=8
CONFIG_BT_ISO_TX_MTU=120
CONFIG_BT_CTLR_ADV_ISO_STREAM_MAX=4
CONFIG_BT_CTLR_SDC_ISO_TX_HCI_BUFFER_COUNT=8
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_GPIO=y
CONFIG_PRINTK=y
# The 1200-baud touch on the USB console (the board's CDC ACM), as in the controller.
CONFIG_UART_LINE_CTRL=y
# Both A and C have the 32 kHz crystal (experiment 21 §6).
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_50PPM=y
