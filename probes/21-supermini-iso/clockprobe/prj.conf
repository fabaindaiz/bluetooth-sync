# Boot on the calibrated RC, like the controller image (rc.conf): the probe never depends on a crystal.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
CONFIG_PRINTK=y
# Read the baud rate the host sets (1200 = go to the UF2 bootloader).
CONFIG_UART_LINE_CTRL=y
