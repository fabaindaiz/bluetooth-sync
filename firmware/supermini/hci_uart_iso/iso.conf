# Extra Kconfig for Zephyr's samples/bluetooth/hci_uart built inside NCS (SoftDevice Controller),
# board promicro_nrf52840/nrf52840/uf2. One image does both roles of the F1/E1 experiments:
# ISO broadcaster (the emitter) and ISO synchronized receiver (the radio-level listener).
# Sources: research/02 §7 (claims 1-4, 6, 8) and NCS v3.4.1 Kconfig, read 2026-10-07.

# Broadcaster: in a raw-HCI build this host option is what turns on BT_CTLR_ADV_ISO.
CONFIG_BT_EXT_ADV=y
CONFIG_BT_ISO_BROADCASTER=y
# Receiver: the same for BT_CTLR_SYNC_ISO.
CONFIG_BT_OBSERVER=y
CONFIG_BT_ISO_SYNC_RECEIVER=y

# Four BIS in one BIG.
CONFIG_BT_ISO_MAX_CHAN=4
CONFIG_BT_CTLR_ADV_ISO_STREAM_MAX=4
CONFIG_BT_CTLR_SYNC_ISO_STREAM_MAX=4
CONFIG_BT_CTLR_PHY_2M=y

# ISO buffers: the defaults are sized for one stream (BT_ISO_TX_BUF_COUNT = 1,
# SDC HCI TX buffers = 3). Four SDUs every 10 ms need more.
CONFIG_BT_ISO_TX_BUF_COUNT=10
CONFIG_BT_ISO_RX_BUF_COUNT=10
CONFIG_BT_CTLR_SDC_ISO_TX_HCI_BUFFER_COUNT=10

# HCI sizes a Bumble host expects (extended/periodic advertising data with a BASE).
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251

# Advertising: the SDC sizes its buffers from these (nrf/subsys/bluetooth/controller/hci_driver.c).
# The default 31 B does not fit an Auracast announcement (service data + Broadcast Name + the
# JBL manufacturer data) nor the BASE in the periodic advertising.
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
CONFIG_BT_CTLR_ADV_SET=2
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=251

# Read the host's baud rate: 1200 reboots into the UF2 bootloader (src/uf2_touch.c).
CONFIG_UART_LINE_CTRL=y
